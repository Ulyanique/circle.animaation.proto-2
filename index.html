<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Янтарный циркуль — three.js</title>
    <meta name="description" content="Янтарный циркуль: заставка, воссозданная в реальном времени на three.js." />
    <meta name="theme-color" content="#000000" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="stage" class="booting">
      <canvas id="view"></canvas>
      <div id="loading" role="status" aria-label="Загрузка"><span>Янтарный циркуль</span><i></i></div>
      <div id="hud">
        <button id="play" title="Пауза / воспроизведение (пробел)" aria-label="Пауза / воспроизведение"></button>
        <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Перемотка" />
        <span id="clock">0:00</span>
        <button id="sound" title="Звук (M)" aria-label="Звук"></button>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
